<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6EFE4">
  <meta name="format-detection" content="telephone=no">
  <title>李某 与 王某 婚礼请柬</title>
  <meta name="description" content="锦书遥寄，待君亲启。">
  <meta itemprop="name" content="李某 与 王某 婚礼请柬">
  <meta itemprop="description" content="锦书遥寄，待君亲启。">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sssssssssss-commits.github.io/Widd/">
  <meta property="og:title" content="李某 与 王某 婚礼请柬">
  <meta property="og:description" content="锦书遥寄，待君亲启。">
  <meta property="og:image" content="https://widd-wall.pages.dev/wx2.jpg">
  <meta property="og:image:secure_url" content="https://widd-wall.pages.dev/wx2.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="600">
  <link rel="image_src" href="https://widd-wall.pages.dev/wx2.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://widd-wall.pages.dev/wx2.jpg">
  <link rel="icon" href="https://widd-wall.pages.dev/wx2.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="https://widd-wall.pages.dev/wx2.jpg">
  <link rel="stylesheet" href="css/invite.css?v=48">
</head>
<body>
  <img class="share-thumb" src="https://widd-wall.pages.dev/wx2.jpg" width="600" height="600" alt="李某 与 王某 婚礼请柬">
  <canvas id="foil" class="foil" aria-hidden="true"></canvas>
  <audio id="bgm" src="assets/bgm.mp3?v=2" loop preload="auto" playsinline webkit-playsinline></audio>
  <button type="button" class="bgm-tog" id="bgmTog" aria-label="关闭音乐" aria-pressed="true">
    <span class="bgm-disc" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M10 4v11.2A3.4 3.4 0 1 0 12 18V8h7V4h-9z"/>
      </svg>
    </span>
  </button>

  <div id="gate" class="gate">
    <p class="gate-hint">锦书遥寄，待君亲启。</p>
    <div class="envelope-stage">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="letter-peek"></div>
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <button type="button" class="seal" id="seal" aria-label="拆开请柬">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="72" height="72" aria-hidden="true">
            <rect x="4" y="4" width="112" height="112" rx="4" fill="#C23B32"/>
            <rect x="10" y="10" width="100" height="100" rx="2" fill="none" stroke="#E4C36A" stroke-width="2.2"/>
            <rect x="16" y="16" width="88" height="88" fill="none" stroke="#E4C36A" stroke-width="1"/>
            <text x="60" y="86" text-anchor="middle" fill="#F7E7C6"
              font-family="Songti SC, STSong, SimSun, serif" font-size="64">囍</text>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main id="letter" class="letter" hidden>
    <article class="letter-inner">
      <p class="address" id="address">恭请光临</p>

      <header class="names" id="names"></header>

      <p class="opener" id="opener"></p>

      <div class="bless" id="bless" hidden aria-hidden="true">
        <div class="bless-lane" id="blessLane"></div>
      </div>

      <section class="when" aria-label="婚期">
        <p class="when-text" id="whenText"></p>
        <div class="clepsydra" id="clepsydra" aria-live="polite">
          <div class="tick"><strong id="d">0</strong><i></i><span>日</span></div>
          <div class="tick"><strong id="h">00</strong><i></i><span>时</span></div>
          <div class="tick"><strong id="m">00</strong><i></i><span>分</span></div>
          <div class="tick"><strong id="s">00</strong><i></i><span>秒</span></div>
        </div>
        <p class="when-past" id="whenPast" hidden>良辰已至</p>
      </section>

      <section class="scrolls-wrap" aria-label="照片">
        <div class="scrolls" id="scrolls"></div>
      </section>

      <section class="venues" id="venues"></section>

      <section class="rsvp" id="rsvp"></section>

      <section class="wall" id="wall" hidden></section>
      <p class="wall-soon" id="wallSoon" hidden>签名墙 · 即将开启</p>

      <footer class="colophon" id="colophon"></footer>
    </article>
  </main>

  <script src="js/invite.js?v=53"></script>
</body>
</html>
