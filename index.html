  <link rel="preload" href="assets/fonts/jin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <img class="share-thumb" src="https://sumuyang.asia/share.jpg" width="300" height="300" alt="李某 与 王某 婚礼请柬">
  <canvas id="foil" class="foil" aria-hidden="true"></canvas>
  <audio id="bgm" src="assets/bgm.mp3?v=2" loop preload="none" playsinline webkit-playsinline></audio>
  <button type="button" class="bgm-tog" id="bgmTog" aria-label="关闭音乐" aria-pressed="true">
    <span class="bgm-disc" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M10 4v11.2A3.4 3.4 0 1 0 12 18V8h7V4h-9z"/>
      </svg>
    </span>
  </button>

  <div id="gate" class="gate">
    <img class="cover-img" id="coverImg" src="assets/cover.jpg?v=2" width="540" height="811" alt="苏超凡 与 杨雨洁 婚礼请柬" fetchpriority="high" decoding="async">
    <button type="button" class="seal" id="seal" aria-label="打开请柬">
      <img class="seal-face" id="sealFace" src="assets/cover.jpg?v=2" alt="" decoding="async">
    </button>
    <p class="gate-hint" id="gateHint" hidden>信笺未至，请用本地服务打开</p>
  </div>

  <main id="letter" class="letter" hidden>
    <article class="letter-inner">
      <p class="address" id="address">恭请光临</p>

      <header class="names" id="names"></header>

      <p class="opener" id="opener"></p>

      <div class="bless" id="bless" hidden aria-hidden="true">
        <div class="bless-lane" id="blessLane"></div>
      </div>

      <section class="when" aria-label="婚期">
        <p class="when-text" id="whenText"></p>
        <div class="cal-wrap">
          <div class="cal-card">
            <img src="assets/calendar.jpg" alt="2026年10月6日 婚礼日历" class="cal-img" width="540" height="505" loading="lazy">
          </div>
        </div>
        <div class="clepsydra" id="clepsydra" aria-live="polite">
          <div class="tick"><strong id="d">0</strong><i></i><span>日</span></div>
          <div class="tick"><strong id="h">00</strong><i></i><span>时</span></div>
          <div class="tick"><strong id="m">00</strong><i></i><span>分</span></div>
          <div class="tick"><strong id="s">00</strong><i></i><span>秒</span></div>
        </div>
        <p class="when-past" id="whenPast" hidden>良辰已至</p>
      </section>

      <section class="itinerary" id="itinerary" aria-label="婚礼仪程" hidden></section>

      <section class="scrolls-wrap" id="scrollsWrap" aria-label="照片" hidden>
        <div class="scrolls" id="scrolls"></div>
      </section>

      <section class="venues" id="venues"></section>

      <section class="rsvp" id="rsvp"></section>

      <section class="wall" id="wall" hidden></section>
      <p class="wall-soon" id="wallSoon" hidden>签名墙 · 即将开启</p>

      <footer class="colophon" id="colophon"></footer>
    </article>
  </main>

  <script src="js/invite.js?v=66"></script>
</body>
</html>
