  <meta property="og:image" content="https://sumuyang.asia/share.jpg">
  <meta property="og:image:secure_url" content="https://sumuyang.asia/share.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="300">
  <meta property="og:image:height" content="300">
  <link rel="image_src" href="https://sumuyang.asia/share.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://sumuyang.asia/share.jpg">
  <link rel="icon" href="https://sumuyang.asia/share.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="https://sumuyang.asia/share.jpg">
  <link rel="stylesheet" href="css/invite.css?v=82">
  <link rel="preload" href="assets/cover.jpg?v=4" as="image">
  <link rel="preload" href="assets/calendar.jpg?v=3" as="image">
  <link rel="preload" href="assets/letter.jpg?v=2" as="image">
  <link rel="preload" href="assets/fonts/jin.woff2?v=6" as="font" type="font/woff2">
  <link rel="preload" href="assets/fonts/name.woff2?v=1" as="font" type="font/woff2">
  <style>
    @font-face {
      font-family: "WiddJin";
      src: url("assets/fonts/jin.woff2?v=6") format("woff2"),
           url("assets/fonts/jin.woff?v=6") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "WiddName";
      src: url("assets/fonts/name.woff2?v=1") format("woff2"),
           url("assets/fonts/name.woff?v=1") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "WiddWall";
      src: url("assets/fonts/wall.woff2?v=2") format("woff2"),
           url("assets/fonts/wall.woff?v=2") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
  <img class="share-thumb" src="https://sumuyang.asia/share.jpg" width="300" height="300" alt="苏超凡 与 杨雨洁 婚礼请柬">
  <canvas id="foil" class="foil" aria-hidden="true"></canvas>
  <audio id="bgm" src="assets/bgm.mp3?v=2" loop preload="none" playsinline webkit-playsinline></audio>
  <button type="button" class="bgm-tog" id="bgmTog" aria-label="关闭音乐" aria-pressed="true">
    <span class="bgm-disc" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M10 4v11.2A3.4 3.4 0 1 0 12 18V8h7V4h-9z"/>
      </svg>
    </span>
  </button>

  <div id="gate" class="gate">
    <div class="flaps" id="flaps" aria-hidden="true">
      <div class="flap flap-top"><div class="flap-cut"><img class="cover-img" src="assets/cover.jpg?v=4" alt="" decoding="async"></div></div>
      <div class="flap flap-mid"><div class="flap-cut"><img class="cover-img" id="coverImg" src="assets/cover.jpg?v=4" width="625" height="1024" alt="苏超凡 与 杨雨洁 婚礼请柬" fetchpriority="high" decoding="async"></div></div>
      <div class="flap flap-bot"><div class="flap-cut"><img class="cover-img" src="assets/cover.jpg?v=4" alt="" decoding="async"></div></div>
    </div>
    <button type="button" class="seal" id="seal" aria-label="打开请柬"></button>
    <p class="gate-tap" id="gateTap" aria-label="轻触开启"><b>—</b><i>·</i><span>轻触开启</span><i>·</i><b>—</b></p>
    <p class="gate-hint" id="gateHint" hidden>信笺未至，请用本地服务打开</p>
  </div>

  <main id="letter" class="letter" hidden>
    <article class="letter-inner">
      <header class="names reveal" id="names"></header>

      <div class="bless" id="bless" hidden aria-hidden="true">
        <div class="bless-lane" id="blessLane"></div>
      </div>

      <section class="when reveal" aria-label="婚期">
        <div class="label">良辰吉日</div>
        <p class="when-text" id="whenText"></p>
        <div class="cal-wrap">
          <div class="cal-card">
            <img src="assets/calendar.jpg?v=3" alt="2026年10月6日 婚礼日历" class="cal-img" width="1024" height="932" fetchpriority="high" decoding="async">
          </div>
        </div>
        <div class="clepsydra" id="clepsydra" aria-live="polite">
          <div class="tick"><strong id="d">0</strong><i></i><span>日</span></div>
          <div class="tick"><strong id="h">00</strong><i></i><span>时</span></div>
          <div class="tick"><strong id="m">00</strong><i></i><span>分</span></div>
          <div class="tick"><strong id="s">00</strong><i></i><span>秒</span></div>
        </div>
        <p class="when-past" id="whenPast" hidden>良辰已至</p>
      </section>

      <section class="itinerary reveal" id="itinerary" aria-label="婚礼仪程" hidden></section>

      <section class="scrolls-wrap" id="scrollsWrap" aria-label="照片" hidden>
        <div class="scrolls" id="scrolls"></div>
      </section>

      <section class="venues reveal" id="venues"></section>

      <section class="rsvp" id="rsvp"></section>

      <section class="wall" id="wall" hidden></section>
      <p class="wall-soon" id="wallSoon" hidden>祝福墙 · 即将开启</p>

      <footer class="colophon reveal" id="colophon"></footer>
    </article>
  </main>

  <script src="js/invite.js?v=85"></script>
</body>
</html>
